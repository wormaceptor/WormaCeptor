name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Publish library artifacts to Maven Central (Sonatype Central Portal)
  # ==========================================================================
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace

  # ==========================================================================
  # Build, sign, and upload demo app .aab to Play Store internal track
  # ==========================================================================
  publish-playstore:
    name: Upload demo app to Play Store
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Decode Play Store service account
        env:
          PLAY_SA_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SA_JSON" | base64 -d > "$RUNNER_TEMP/play-sa.json"
          echo "PLAY_STORE_SERVICE_ACCOUNT_JSON=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"

      - name: Build release bundle
        run: ./gradlew :app:bundleRelease

      - name: Publish to Play Store (internal track)
        run: ./gradlew :app:publishReleaseBundle --track internal

      - name: Upload mapping for crash deobfuscation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ github.event.release.tag_name }}
          path: app/build/outputs/mapping/release/mapping.txt

  # ==========================================================================
  # Attach .aab + mapping.txt to the GitHub Release
  # ==========================================================================
  attach-artifacts:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: publish-playstore
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release artifacts
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      - name: Attach .aab, .apk, mapping.txt to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "app/build/outputs/bundle/release/app-release.aab" \
            "app/build/outputs/apk/release/app-release.apk" \
            "app/build/outputs/mapping/release/mapping.txt" \
            --clobber

  # ==========================================================================
  # Attach the MCP bridge jar; the stable asset name keeps
  # releases/latest/download/wormaceptor-mcp-bridge.jar working for agents
  # ==========================================================================
  attach-mcp-bridge:
    name: Attach MCP bridge jar to GitHub Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build bridge jar
        run: |
          ./gradlew :mcp:bridge:jar --no-configuration-cache
          cp mcp/bridge/build/libs/bridge.jar wormaceptor-mcp-bridge.jar
          sha256sum wormaceptor-mcp-bridge.jar > wormaceptor-mcp-bridge.jar.sha256

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            wormaceptor-mcp-bridge.jar \
            wormaceptor-mcp-bridge.jar.sha256 \
            --clobber

  # ==========================================================================
  # Publish the npx launcher (wormaceptor-mcp); it downloads the jar above
  # ==========================================================================
  publish-npm-launcher:
    name: Publish wormaceptor-mcp to npm
    runs-on: ubuntu-latest
    needs: attach-mcp-bridge
    # Trusted publishing (OIDC): no npm token. npm only accepts it from this workflow file once the
    # package's Settings -> Trusted publishing lists wormaceptor/WormaCeptor + release.yml.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # Trusted publishing needs Node 22.14+ and npm CLI 11.5.1+; bun's publish docs only cover token auth.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish
        working-directory: mcp/npx
        run: |
          # The first version must be published by hand (trusted publishing is configured per existing package).
          if ! npm view wormaceptor-mcp version >/dev/null 2>&1; then
            echo "::notice::wormaceptor-mcp isn't on npm yet; publish it once by hand, then add the trusted publisher."
            exit 0
          fi
          npm install -g npm@latest
          npm publish --access public

  # ==========================================================================
  # List the server in the official MCP Registry (needs the npm version above)
  # ==========================================================================
  publish-mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: publish-npm-launcher
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      # The key's public half is the v=MCPv1 TXT record on wormaceptor.com.
      - name: Publish
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_PRIVATE_KEY" ]; then
            echo "::error::MCP_PRIVATE_KEY secret is missing"
            exit 1
          fi
          ./mcp-publisher login dns --domain wormaceptor.com --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish

  # ==========================================================================
  # Open a PR on the website that bumps the version; content edits go on the same PR
  # ==========================================================================
  update-website:
    name: Open website version PR
    runs-on: ubuntu-latest
    needs: publish-maven
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Bump version and open PR
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::WEBSITE_TOKEN secret is missing"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          branch="chore/version-$version"
          gh auth setup-git
          gh repo clone wormaceptor/WormaCeptorWeb web -- --depth 1
          cd web
          sed -i -E "s/^export const VERSION = \"[^\"]+\";/export const VERSION = \"$version\";/" src/lib/site.ts
          grep -rlE 'com\.azikar24\.wormaceptor:[a-z-]+:[0-9]+\.[0-9]+\.[0-9]+"' content \
            | xargs -r sed -i -E "s/(com\.azikar24\.wormaceptor:[a-z-]+:)[0-9]+\.[0-9]+\.[0-9]+\"/\1$version\"/g"
          if git diff --quiet; then
            echo "Website already on $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "docs: bump install snippets to WormaCeptor $version"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs: bump install snippets to WormaCeptor $version" \
            --body "Opened by the WormaCeptor release workflow for $RELEASE_TAG. Add content changes from the release notes to this PR before merging: https://github.com/wormaceptor/WormaCeptor/releases/tag/$RELEASE_TAG"
